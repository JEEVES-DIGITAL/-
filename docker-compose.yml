version: '3.8'

services:
  jeeves-core:
    build:
      context: ./jeeves-core
      dockerfile: Dockerfile
    container_name: jeeves-core
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "5683:5683/udp"
    volumes:
      - ./config:/config
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Shanghai
      - JEEVES_MODE=production
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
      - postgres
      - redis
    networks:
      - jeeves-network

  ollama:
    image: ollama/ollama:latest
    container_name: jeeves-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - jeeves-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  postgres:
    image: postgres:16-alpine
    container_name: jeeves-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jeeves
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jeeves123}
      POSTGRES_DB: jeeves
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - jeeves-network

  redis:
    image: redis:7-alpine
    container_name: jeeves-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - jeeves-network

  mqtt:
    image: eclipse-mosquitto:2
    container_name: jeeves-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto:/mosquitto/config
      - mqtt-data:/mosquitto/data
      - mqtt-logs:/mosquitto/log
    networks:
      - jeeves-network

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: jeeves-frigate
    restart: unless-stopped
    privileged: true
    ports:
      - "8971:8971"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    volumes:
      - ./config/frigate:/config
      - frigate-media:/media/frigate
      - /etc/localtime:/etc/localtime:ro
    environment:
      - FRIGATE_RTSP_PASSWORD=${FRIGATE_PASSWORD:-jeeves}
    networks:
      - jeeves-network

volumes:
  ollama-data:
  postgres-data:
  redis-data:
  mqtt-data:
  mqtt-logs:
  frigate-media:

networks:
  jeeves-network:
    driver: bridge
