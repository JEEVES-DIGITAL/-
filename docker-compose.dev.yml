version: '3.8'

services:
  jeeves-core:
    build:
      context: ./jeeves-core
      dockerfile: Dockerfile.dev
    container_name: jeeves-core-dev
    restart: "no"
    ports:
      - "8123:8123"
      - "5683:5683/udp"
    volumes:
      - ./jeeves-core:/app
      - ./config:/config
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
      - JEEVES_MODE=development
      - DEBUG=true
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
      - postgres
      - redis
    networks:
      - jeeves-dev-network

  ollama:
    image: ollama/ollama:latest
    container_name: jeeves-ollama-dev
    restart: unless-stopped
    volumes:
      - ollama-dev-data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - jeeves-dev-network

  postgres:
    image: postgres:16-alpine
    container_name: jeeves-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: jeeves
      POSTGRES_PASSWORD: jeeves
      POSTGRES_DB: jeeves_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - jeeves-dev-network

  redis:
    image: redis:7-alpine
    container_name: jeeves-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    networks:
      - jeeves-dev-network

volumes:
  ollama-dev-data:
  postgres-dev-data:
  redis-dev-data:

networks:
  jeeves-dev-network:
    driver: bridge
