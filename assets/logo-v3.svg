<!-- 基维斯 Logo SVG 初版 - 方案C: 极简几何 -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F"/>
      <stop offset="50%" style="stop-color:#2C5282"/>
      <stop offset="100%" style="stop-color:#1E3A5F"/>
    </linearGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4AA"/>
      <stop offset="100%" style="stop-color:#00B894"/>
    </linearGradient>
  </defs>
  
  <!-- 外圆 -->
  <circle cx="100" cy="100" r="95" fill="url(#mainGradient)"/>
  
  <!-- 内圆装饰 -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#2C5282" stroke-width="1"/>
  
  <!-- 中心图形 - 抽象J/控制面板 -->
  <rect x="65" y="55" width="70" height="90" rx="12" fill="white"/>
  
  <!-- 顶部显示屏 -->
  <rect x="75" y="65" width="50" height="35" rx="6" fill="#1E3A5F"/>
  
  <!-- 屏幕内容 - 眼睛/指示灯 -->
  <circle cx="88" cy="82" r="5" fill="url(#highlightGradient)"/>
  <circle cx="112" cy="82" r="5" fill="url(#highlightGradient)"/>
  <rect x="88" y="92" width="24" height="3" rx="1.5" fill="#00D4AA" opacity="0.6"/>
  
  <!-- 分割线 (管家腰带) -->
  <rect x="65" y="105" width="70" height="4" fill="#1E3A5F"/>
  
  <!-- 控制按钮区域 -->
  <circle cx="85" cy="120" r="4" fill="#00D4AA"/>
  <circle cx="100" cy="120" r="4" fill="#00D4AA" opacity="0.6"/>
  <circle cx="115" cy="120" r="4" fill="#00D4AA" opacity="0.3"/>
  
  <!-- 底部底座 -->
  <rect x="85" y="135" width="30" height="3" rx="1.5" fill="#2C5282"/>
  
  <!-- 外围装饰点 - 智能节点 -->
  <circle cx="100" cy="25" r="3" fill="#00D4AA"/>
  <circle cx="175" cy="100" r="3" fill="#00D4AA" opacity="0.7"/>
  <circle cx="100" cy="175" r="3" fill="#00D4AA" opacity="0.5"/>
  <circle cx="25" cy="100" r="3" fill="#00D4AA" opacity="0.7"/>
  
  <!-- 连接线 -->
  <line x1="100" y1="28" x2="100" y2="55" stroke="#00D4AA" stroke-width="1" opacity="0.4"/>
  <line x1="135" y1="100" x2="172" y2="100" stroke="#00D4AA" stroke-width="1" opacity="0.3"/>
</svg>
