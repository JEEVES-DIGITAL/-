<!-- 基维斯 Logo SVG 初版 - 方案A: 字母J + 智能管家 -->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 定义渐变 -->
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F"/>
      <stop offset="100%" style="stop-color:#2C5282"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4AA"/>
      <stop offset="100%" style="stop-color:#00B894"/>
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="100" cy="100" r="90" fill="url(#primaryGradient)"/>
  
  <!-- 管家头部轮廓 (字母J的变形) -->
  <path d="M 60 50 
           Q 60 40, 70 40 
           L 130 40 
           Q 140 40, 140 50 
           L 140 80 
           Q 140 100, 120 100 
           L 100 100 
           Q 80 100, 80 120 
           L 80 150 
           Q 80 160, 70 160 
           L 60 160 
           Q 50 160, 50 150 
           L 50 120 
           Q 50 110, 60 110 
           L 70 110 
           Q 80 110, 80 100 
           L 80 80 
           Q 80 70, 70 70 
           L 60 70 
           Z" 
        fill="white"/>
  
  <!-- 眼睛 (AI感知) -->
  <circle cx="85" cy="65" r="6" fill="url(#accentGradient)"/>
  <circle cx="115" cy="65" r="6" fill="url(#accentGradient)"/>
  
  <!-- 微笑 -->
  <path d="M 90 85 Q 100 90, 110 85" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- 领结 (管家标识) -->
  <path d="M 85 105 L 115 105 L 108 115 L 100 110 L 92 115 Z" fill="url(#accentGradient)"/>
  
  <!-- 网络节点装饰 -->
  <circle cx="30" cy="100" r="4" fill="#00D4AA" opacity="0.6"/>
  <circle cx="170" cy="80" r="3" fill="#00D4AA" opacity="0.4"/>
  <circle cx="160" cy="130" r="5" fill="#00D4AA" opacity="0.5"/>
  
  <!-- 连接线 -->
  <line x1="34" y1="100" x2="50" y2="100" stroke="#00D4AA" stroke-width="1" opacity="0.4"/>
  <line x1="140" y1="85" x2="167" y2="82" stroke="#00D4AA" stroke-width="1" opacity="0.3"/>
</svg>
