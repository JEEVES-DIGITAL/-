<!-- 基维斯 Logo SVG - 最终版本 -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 主渐变 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F"/>
      <stop offset="100%" style="stop-color:#0F1F33"/>
    </linearGradient>
    <!-- 强调渐变 -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4AA"/>
      <stop offset="100%" style="stop-color:#00B894"/>
    </linearGradient>
    <!-- 眼睛发光 -->
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00D4AA"/>
      <stop offset="100%" style="stop-color:#00B894"/>
    </radialGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>
  
  <!-- 外圈装饰 -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#2C5282" stroke-width="2" opacity="0.5"/>
  
  <!-- 智能管家头部轮廓 -->
  <g transform="translate(256, 256)">
    <!-- 头部主体 -->
    <path d="M -80 -100 
             Q -80 -130, -50 -130 
             L 50 -130 
             Q 80 -130, 80 -100 
             L 80 -30 
             Q 80 0, 50 0 
             L 0 0 
             Q -40 0, -40 40 
             L -40 100 
             Q -40 120, -60 120 
             L -80 120 
             Q -100 120, -100 100 
             L -100 50 
             Q -100 30, -80 30 
             L -60 30 
             Q -40 30, -40 10 
             L -40 -20 
             Q -40 -50, -80 -50 
             Z" 
          fill="white"/>
    
    <!-- 眼睛 (AI感知) -->
    <g transform="translate(0, -70)">
      <!-- 左眼 -->
      <ellipse cx="-25" cy="0" rx="12" ry="15" fill="url(#eyeGlow)"/>
      <circle cx="-25" cy="0" r="6" fill="white" opacity="0.8"/>
      <!-- 右眼 -->
      <ellipse cx="25" cy="0" rx="12" ry="15" fill="url(#eyeGlow)"/>
      <circle cx="25" cy="0" r="6" fill="white" opacity="0.8"/>
    </g>
    
    <!-- 微笑 -->
    <path d="M -30 -30 Q 0 -20, 30 -30" 
          stroke="white" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
    
    <!-- 领结/领结 -->
    <g transform="translate(0, 20)">
      <path d="M -35 0 L -10 10 L -10 -10 Z" fill="url(#accentGradient)"/>
      <path d="M 35 0 L 10 10 L 10 -10 Z" fill="url(#accentGradient)"/>
      <circle cx="0" cy="0" r="8" fill="url(#accentGradient)"/>
    </g>
  </g>
  
  <!-- 智能节点装饰 -->
  <circle cx="80" cy="256" r="8" fill="#00D4AA" opacity="0.6"/>
  <circle cx="432" cy="200" r="6" fill="#00D4AA" opacity="0.4"/>
  <circle cx="400" cy="320" r="10" fill="#00D4AA" opacity="0.5"/>
  <circle cx="120" cy="380" r="5" fill="#00D4AA" opacity="0.3"/>
  
  <!-- 连接线 -->
  <line x1="88" y1="256" x2="176" y2="256" stroke="#00D4AA" stroke-width="2" opacity="0.3"/>
  <line x1="336" y1="210" x2="426" y2="203" stroke="#00D4AA" stroke-width="1.5" opacity="0.2"/>
  <line x1="350" y1="280" x2="395" y2="315" stroke="#00D4AA" stroke-width="2" opacity="0.25"/>
</svg>
